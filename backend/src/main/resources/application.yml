server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campusx?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by database/schema.sql
campusx:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789}
  upload-dir: ./uploads
  cors-origin: http://localhost:5173
  frontend-url: http://localhost:5173
