name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /campusss/
          # Optional: set a repository variable named VITE_API_URL (Settings > Secrets and variables > Actions > Variables)
          # to the address of your hosted backend. Leave it unset and the site loads but cannot log in.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # GitHub Pages has no server-side routing: unknown paths fall back to the app so deep links like /campusss/login work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
